      - mata kabur
      - ruam parah
      - ruam kulit parah
      - ruam di seluruh badan
      - gatal parah
      - kulit melepuh
      - muntah terus
      - muntah muntah terus
      - kesemutan berat
      - tidak bisa mendengar
      - pendengaran berkurang
      - yellow eyes
      - yellow skin
      - blurred vision
      - severe rash
      - keep vomiting
      - vomiting all the time
