      - melukai diri
      - mengakhiri hidup
      - akhiri hidup
      - tidak ingin hidup
      - gak mau hidup lagi
      - kill myself
      - suicide
      - end my life
      - hurt myself
      - self harm
      - want to die

  ADVERSE_DRUG:
