# Safety keyword rules (Bahasa Indonesia + English).
#
# Matching (app/bot/safety.py) is case- and diacritic-insensitive and word-based:
# - punctuation and hyphens count as spaces ("muntah-muntah" == "muntah muntah");
# - a keyword's words must appear in order, with at most 2 other words between
#   them ("batuk darah sangat banyak" matches "batuk darah banyak");
# - common suffixes are tolerated ("darahnya", "obatku" match "darah", "obat").
#
# These rules ALWAYS run, even when the AI budget is exhausted. Severity:
# high / emergency -> fixed safety reply, a case for staff, conversation -> HUMAN.
# The Settings page can override this file (stored in the database).

categories:
  EMERGENCY:
    severity: emergency
    keywords:
      - batuk darah banyak
      - muntah darah
      - sesak napas berat
      - sesak nafas berat
      - sesak berat
      - susah bernapas
      - susah bernafas
      - sulit bernapas
      - sulit bernafas
      - tidak bisa bernapas
      - tidak bisa bernafas
      - gak bisa napas
      - nyeri dada
      - sakit dada hebat
      - dada sakit sekali
      - pingsan
      - tidak sadarkan diri
      - bibir biru
      - bibir membiru
      - kejang
      - coughing up blood
      - cough up blood
      - can't breathe
      - cannot breathe
      - severe shortness of breath
      - chest pain
      - fainted
      - passed out
      - blue lips

  SELF_HARM:
