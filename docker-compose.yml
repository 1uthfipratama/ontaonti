name: onti-hub

x-backend: &backend
  build: .
  image: onti-hub-backend
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://onti:${POSTGRES_PASSWORD:-onti_dev_only}@db:5432/onti
    REDIS_URL: redis://redis:6379/0
    DATA_DIR: /app/data/kb
    MEDIA_DIR: /app/data/media
    KB_LIVE_DIR: /app/data/kb_live
    WHISPER_DIR: /app/data/whisper
    # Shell overrides win, e.g. `LLM_PROVIDER=fake docker compose up` for an offline demo.
    LLM_PROVIDER: ${LLM_PROVIDER:-groq}
  volumes:
    - kbdata:/app/data
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: onti
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onti_dev_only}
      POSTGRES_DB: onti
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onti -d onti"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    <<: *backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  worker:
    <<: *backend
    command: ["arq", "app.worker.WorkerSettings"]
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    image: onti-hub-web
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  # Public HTTPS URL for Meta webhooks (Cloudflare quick tunnel, no account needed).
  # Start:   docker compose --profile tunnel up -d tunnel
  # URL:     docker compose logs tunnel   (look for https://...trycloudflare.com)
  # The URL changes whenever this container restarts: update it in Meta then.
  tunnel:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "--url", "http://api:8000"]
    profiles: ["tunnel"]
    depends_on:
      - api
    restart: unless-stopped

  # Daily backups of the database and media files into ./backups (keeps 14 days).
  backup:
    image: postgres:16-alpine
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-onti_dev_only}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ./backups:/backups
      - kbdata:/data:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # HTTPS on a real server (see docs/HOSTING.md):
  #   WEB_DOMAIN=hub.example.org API_DOMAIN=api.example.org docker compose --profile https up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:-}
      API_DOMAIN: ${API_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  kbdata:
  caddydata:
