[project]
name = "onti-erlani-hub"
version = "0.1.0"
description = "Omnichannel inbox + TB companion chatbot + admin dashboard (feasibility prototype)."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]  # Depends() in defaults; long lines are prompts (formatter wraps code)

[tool.ruff.lint.per-file-ignores]
"rag/*" = ["E501", "UP", "B"]  # vendored: kept as close to the original as possible
